name: Build GabrielOS TV APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk GabrielOS-TV.apk

      - uses: actions/upload-artifact@v7
        with:
          name: GabrielOS-TV-apk
          path: GabrielOS-TV.apk

      - name: Publish to Releases (download APK directly)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.run_number }}
          name: GabrielOS TV build ${{ github.run_number }}
          files: GabrielOS-TV.apk
